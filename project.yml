# XcodeGen spec. Generate the project with:
#   brew install xcodegen
#   xcodegen generate
# Forge.xcodeproj is never committed.
name: Forge
options:
  bundleIdPrefix: app.forge
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic

packages:
  ForgeCore:
    path: ForgeCore

targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: Forge
        excludes:
          - "Config/Info.plist"
          - "Config/Local.xcconfig.example"
          - "Config/Forge.entitlements"
          - "**/README.md"
    configFiles:
      Debug: Forge/Config/Base.xcconfig
      Release: Forge/Config/Base.xcconfig
    dependencies:
      - package: ForgeCore
    settings:
      base:
        INFOPLIST_FILE: Forge/Config/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"

  ForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ForgeTests
    dependencies:
      - target: Forge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Forge:
    build:
      targets:
        Forge: all
        ForgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ForgeTests
        - package: ForgeCore/ForgeCoreTests
    archive:
      config: Release
